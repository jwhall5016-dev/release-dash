# Server Configuration
server.port=8080
spring.application.name=release-dashboard-backend

# No database configuration - using JFrog Artifactory as the source of truth
# Explicitly disable database auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# CORS Configuration (only needed if frontend is on different origin)
# Since frontend is served from the same origin, CORS is not needed in production
# But we keep it for development flexibility
spring.web.cors.allowed-origins=${CORS_ORIGINS:}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JFrog Configuration
jfrog.url=${JFROG_URL:https://slingshotaerospace.jfrog.io/artifactory}
jfrog.username=${JFROG_USERNAME:}
jfrog.token=${JFROG_TOKEN:}
# Mentat release artifacts: {repo-key}/{prefix}/{repository}/{environment}/{release}/
mentat.jfrog.repo-key=${JFROG_MENTAT_REPO_KEY:ssa-generic}
mentat.jfrog.prefix=${JFROG_MENTAT_PREFIX:generic-release-artifacts}

# Foobar release artifacts. Leave either value blank and /foobar/api/releases stays empty.
# Example once a folder exists: JFROG_FOOBAR_REPO_KEY=ssa-generic and JFROG_FOOBAR_PREFIX=foobar-release-artifacts
foobar.jfrog.repo-key=${JFROG_FOOBAR_REPO_KEY:}
foobar.jfrog.prefix=${JFROG_FOOBAR_PREFIX:}

# Live /version endpoint catalog (edit backend/src/main/resources/live-services.yml)
spring.config.import=optional:classpath:live-services.yml

# Webhook Configuration
webhook.secret=${WEBHOOK_SECRET:}

# CMDB Git catalog. Cluster uses GitHub App (CMDB - Release Dashboard) via
# CMDB_GITHUB_APP_* plus ExternalSecret private_key. PAT is fallback only.
cmdb.enabled=${CMDB_ENABLED:false}
cmdb.github.owner=${CMDB_GITHUB_OWNER:}
cmdb.github.repo=${CMDB_GITHUB_REPO:}
cmdb.github.branch=${CMDB_GITHUB_BRANCH:main}
cmdb.github.token=${CMDB_GITHUB_TOKEN:}
cmdb.github.app-id=${CMDB_GITHUB_APP_ID:}
cmdb.github.installation-id=${CMDB_GITHUB_APP_INSTALLATION_ID:}
cmdb.github.private-key=${CMDB_GITHUB_APP_PRIVATE_KEY:}
cmdb.index.path=${CMDB_INDEX_PATH:cmdb/cis.yaml}
cmdb.schema.path=${CMDB_SCHEMA_PATH:schema/ci-record.schema.json}
cmdb.write.mode=${CMDB_WRITE_MODE:pr}
cmdb.cache.ttl-seconds=${CMDB_CACHE_TTL_SECONDS:45}

# Foobar CMDB repo: slingshot-aerospace-inc/foobarcmdb.
# A blank token skips the GitHub call. Setting the token reads this repo's index.
foobar.cmdb.github.owner=${CMDB_FOOBAR_GITHUB_OWNER:slingshot-aerospace-inc}
foobar.cmdb.github.repo=${CMDB_FOOBAR_GITHUB_REPO:foobarcmdb}
foobar.cmdb.github.branch=${CMDB_FOOBAR_GITHUB_BRANCH:main}
foobar.cmdb.github.token=${CMDB_FOOBAR_GITHUB_TOKEN:}
foobar.cmdb.index.path=${CMDB_FOOBAR_INDEX_PATH:cmdb/cis.yaml}

# Logging
logging.level.root=INFO
logging.level.com.releasedash=DEBUG
