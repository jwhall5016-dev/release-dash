deployment-simple:
  environment: default

  image:
    pullPolicy: Always

  aws:
    iam:
      role: release-dash

  env:
    JFROG_URL:
      value: https://slingshotaerospace.jfrog.io/artifactory
    JFROG_MENTAT_REPO_KEY:
      value: ssa-generic
    JFROG_MENTAT_PREFIX:
      value: generic-release-artifacts
    JFROG_FOOBAR_REPO_KEY:
      value: ""
    JFROG_FOOBAR_PREFIX:
      value: ""
    CORS_ORIGINS:
      value: http://localhost:3000,http://localhost:5173
    CMDB_ENABLED:
      value: "false"
    CMDB_GITHUB_OWNER:
      value: slingshot-aerospace-inc
    CMDB_GITHUB_REPO:
      value: mentatcmdb
    CMDB_GITHUB_BRANCH:
      value: main
    CMDB_GITHUB_APP_ID:
      value: "5199318"
    CMDB_GITHUB_APP_INSTALLATION_ID:
      value: "168195525"
    CMDB_FOOBAR_GITHUB_OWNER:
      value: slingshot-aerospace-inc
    CMDB_FOOBAR_GITHUB_REPO:
      value: foobarcmdb
    CMDB_FOOBAR_GITHUB_BRANCH:
      value: main
    CMDB_WRITE_MODE:
      value: pr

  externalSecrets:
    secretsJson:
      jfrog:
        secretName: /release-dash/artifact-repository/token
        keyMappings:
          JFROG_USERNAME: username
          JFROG_TOKEN: token
      cmdb-github:
        secretName: /release-dash/cmdb-github/app
        keyMappings:
          CMDB_GITHUB_APP_PRIVATE_KEY: private_key
